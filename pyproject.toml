[project]
name = "beacon"
version = "0.1.0"
description = "A small security analytics pipeline: ATT&CK-mapped SQL detections and anomaly scoring over public attack logs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "pyyaml>=6.0",
    "tzdata>=2024.1",
]

[project.scripts]
beacon = "beacon.cli:main"

[dependency-groups]
dashboard = [
    "streamlit>=1.66.0",
]
dev = [
    "bandit>=1.8",
    "mypy>=1.13",
    "pip-audit>=2.7",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beacon"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=beacon --cov-report=term-missing"

[tool.coverage.report]
fail_under = 80

[tool.bandit]
exclude_dirs = ["tests"]
